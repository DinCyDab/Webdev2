<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <div class="content">
        <header>
            <div class="title-group">
                <h2 class="header-title">Reports</h2>
            </div>
            <div class="nav-group">
                <img src="/imgsrc/notif.png" alt="notifications">
                <div class="vertical-line"></div>
                <img src="/imgsrc/profile.png" alt="profile picture">
            </div>
        </header>

        <!--LINE CHART-->
        <div class="line-container">
            <div class="average">
                <h3>Average: $$$</h3>
            </div>
            <div id="expenses">
                <canvas id="linechart"></canvas>
            </div>
        </div>

        <!--PIE CHART-->
        <div class="container">
            <div class="chart" id="category">
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chartVertical-line"></div>
            <!--BAR GRAPH-->
            <div class="chart" id="bar">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="ranking">
            <div class="upper-title">
                <h3>Bill Amount Ranking</h3>
                <h3>Top 10</h3>
            </div>
            <div class="details"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="logo">
            <img src="/imgsrc/logo.png" alt="">
        </div>
        <ul class="nav-menu">
            <li><button>Home</button></li>
            <li><button>Add</button></li>
            <li><button class="active">Reports</button></li>
            <li><button>Personal</button></li>
        </ul>
        <ul class="nav-footer">
            <li><button>Settings</button></li>
            <li><button>Help</button></li>
            <li><button>Log out</button></li>
        </ul>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script> 
    <script src="lineChart.js"></script>
    <script src="pieChart.js"></script>
    <script src="barChart.js"></script>
</body>
</html>
